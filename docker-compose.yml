# SorriDonto: app (Node) + Caddy (HTTPS). Só o Caddy publica portas; o app fica numa rede interna.
services:
  app:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-node:22-alpine}   # na AWS: espelho public.ecr.aws (sem limite do Docker Hub)
    image: sorridonto:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aegislock.local}
      DATA_KEY_FILE: /run/secrets/data_key              # chave de criptografia dos dados (32 bytes, base64)
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password  # usada só na primeira execução
    secrets: [data_key, admin_password]
    volumes:
      - dados:/data
    networks: [interna]
    read_only: true                 # o sistema de arquivos do contêiner é só leitura
    tmpfs: [/tmp]
    cap_drop: [ALL]                 # sem nenhuma capability do Linux
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 384m
    cpus: 0.75

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.8.4-alpine}
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no arquivo .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z   # ",z" ajusta o rótulo SELinux (Fedora/RHEL); é ignorado onde não há SELinux
      - caddy_data:/data            # certificados
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [interna]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

secrets:
  data_key:
    file: ./secrets/data_key
  admin_password:
    file: ./secrets/admin_password

volumes:
  dados:
  caddy_data:
  caddy_config:

networks:
  interna:
