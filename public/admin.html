<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Painel – AegisLock</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="app">
  <!-- login -->
  <main id="tela-login" class="login-tela" hidden>
    <form class="login-box" id="form-login" autocomplete="on">
      <h1>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5 19.5 5.5v5.7c0 4.6-3.1 8.4-7.5 10.3-4.4-1.9-7.5-5.7-7.5-10.3V5.5z"/><rect x="8.8" y="10.8" width="6.4" height="5" rx="1"/><path d="M10 10.8V9.4a2 2 0 0 1 4 0v1.4"/></svg>
        AegisLock
      </h1>
      <p class="sub">Acesso para administradores, porteiros e moradores.</p>
      <div class="campo"><label for="login-email">E-mail</label><input id="login-email" name="email" type="email" required autocomplete="username"></div>
      <div class="campo"><label for="login-senha">Senha</label><input id="login-senha" name="senha" type="password" required autocomplete="current-password"></div>
      <p class="msg" id="login-msg" role="alert"></p>
      <button class="btn bloco grande" type="submit">Entrar</button>
      <p class="centro"><a href="/">← Voltar ao site</a></p>
    </form>
  </main>

  <!-- painel -->
  <div id="tela-app" class="shell" hidden>
    <aside class="lado">
      <a class="logo" href="/">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5 19.5 5.5v5.7c0 4.6-3.1 8.4-7.5 10.3-4.4-1.9-7.5-5.7-7.5-10.3V5.5z"/><rect x="8.8" y="10.8" width="6.4" height="5" rx="1"/><path d="M10 10.8V9.4a2 2 0 0 1 4 0v1.4"/></svg>
        AegisLock
      </a>
      <div class="lado-rot" id="empresa-nome">MENU</div>
      <nav id="abas" role="tablist" aria-label="Seções"></nav>
      <div class="lado-fim">
        <div class="usuario">
          <span class="avatar" id="usuario-avatar"></span>
          <div><strong id="usuario-nome"></strong><small id="usuario-perfil"></small></div>
        </div>
        <button class="btn small ghost" id="btn-sair" type="button">Sair</button>
      </div>
    </aside>

    <div class="principal">
      <main class="painel">
        <div class="cabeca">
          <div>
            <h1 id="titulo-pagina"></h1>
            <p id="subtitulo-pagina"></p>
          </div>
          <button class="btn" id="btn-novo" type="button" hidden>Novo</button>
        </div>
        <div class="estat" id="estat" hidden></div>
        <div class="portaria" id="portaria" hidden>
          <div class="portaria-box">
            <div class="campo"><label for="p-leitor">Crachá lido</label><select id="p-leitor"></select></div>
            <div class="campo"><label for="p-local">Local (porta)</label><select id="p-local"></select></div>
            <button class="btn grande" id="p-passar" type="button">Passar crachá</button>
          </div>
          <div id="p-resultado" role="status" aria-live="polite"></div>
        </div>
        <div class="ferramentas" id="ferramentas" hidden>
          <input type="search" id="busca" placeholder="Buscar" aria-label="Buscar">
          <select id="filtro" class="filtro" aria-label="Filtrar" hidden></select>
        </div>
        <p class="msg" id="app-msg" role="status"></p>
        <div class="tabela-wrap"><table id="tabela"></table></div>
      </main>
    </div>
  </div>

  <!-- formulário -->
  <dialog id="dialogo">
    <form id="form" method="dialog" novalidate>
      <h2 id="dialogo-titulo"></h2>
      <div id="campos" class="dois"></div>
      <p class="msg" id="form-msg" role="alert"></p>
      <div class="rod-dialogo">
        <button class="btn ghost" type="button" id="btn-cancelar">Cancelar</button>
        <button class="btn" type="submit" id="btn-salvar">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="/admin.js"></script>
</body>
</html>
